name: Vocogni diagnostics checks

on:
  push:
    branches:
      - feature/lesson-diagnostics-v1.4
      - main
  pull_request:
    branches:
      - main

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and diagnostic modules
        run: |
          python -m py_compile data.py diagnostics.py logic.py state.py whiteboards.py sections/course.py sections/progress.py sections/profile.py sections/settings.py sections/notes.py sections/whiteboard_editor.py version.py
      - name: Validate whiteboard browser JavaScript
        run: node --check components/whiteboard/whiteboard.js
      - name: Run diagnostic engine unit tests
        run: |
          python -m unittest discover -s tests -v
