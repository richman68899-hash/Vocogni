name: Course quality audits

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  course-quality:
    name: Static course and assessment quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run strict learning-core and pilot-readiness audits
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          python scripts/audit_learning_core.py --strict --output artifacts/learning-core-audit.json
          learning_core_status=$?
          python scripts/audit_pilot_readiness.py --strict --output artifacts/pilot-readiness.json
          pilot_status=$?
          set -e

          if [ "$learning_core_status" -ne 0 ] || [ "$pilot_status" -ne 0 ]; then
            echo "Course-quality audit failed (learning core: $learning_core_status; pilot readiness: $pilot_status)."
            exit 1
          fi

      - name: Upload machine-readable audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-quality-audit
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14
